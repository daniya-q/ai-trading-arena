name: Trading Schedule

on:
  schedule:
    # ── Upstox token request + retries (IST = UTC+5:30) ──────────
    # 8:30 AM IST = 3:00 AM UTC  — initial request
    - cron: "0 3 * * 1-5"
    # 9:30 AM IST = 4:00 AM UTC  — retry 1 (if not yet approved)
    - cron: "0 4 * * 1-5"
    # 10:00 AM IST = 4:30 AM UTC — retry 2
    - cron: "30 4 * * 1-5"
    # 10:30 AM IST = 5:00 AM UTC — retry 3
    - cron: "0 5 * * 1-5"
    # ── Server health pings ───────────────────────────────────────
    # 9:15 AM IST = 3:45 AM UTC  — market open
    - cron: "45 3 * * 1-5"
    # 3:30 PM IST = 10:00 AM UTC — market close
    - cron: "0 10 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  # ── Token request / retry ──────────────────────────────────────
  # Runs at 8:30, 9:30, 10:00, 10:30 AM IST.
  # The server checks Supabase UPSTOX_TOKEN_DATE before sending —
  # if already approved today it responds "already_approved" and skips.
  request-token:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 3 * * 1-5'  ||
      github.event.schedule == '0 4 * * 1-5'  ||
      github.event.schedule == '30 4 * * 1-5' ||
      github.event.schedule == '0 5 * * 1-5'
    steps:
      - name: Request Upstox token approval
        run: |
          echo "Sending token request at $(date -u '+%H:%M UTC')"
          curl -s --max-time 30 -X POST \
            "https://ai-trading-arena-backend-production.up.railway.app/api/request-upstox-token" \
            -H "Content-Type: application/json"

  # ── Health ping ────────────────────────────────────────────────
  ping:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '45 3 * * 1-5' ||
      github.event.schedule == '0 10 * * 1-5'
    steps:
      - name: Ping trading server
        run: |
          echo "Pinging server at $(date -u '+%H:%M UTC')"
          curl -f --max-time 30 \
            "https://ai-trading-arena-backend-production.up.railway.app/ping"
